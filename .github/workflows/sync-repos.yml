name: Sync repositories

# Keeps github.3li.info in step with the account: every hour the list of public
# repositories is read and docs/assets/repos.json is rewritten when it changed,
# so a new repository shows on the site without editing anything by hand.
on:
  schedule:
    - cron: '11 * * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [repo-added]
  push:
    branches: [main]
    paths:
      - scripts/sync-repos.mjs
      - .github/workflows/sync-repos.yml

permissions:
  contents: write
  pages: write

concurrency:
  group: sync-repos
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test
        run: node --test tests/*.test.mjs

      - name: Read the account's repositories
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/sync-repos.mjs

      - name: Commit when something changed
        id: commit
        run: |
          if git diff --quiet -- docs/assets/repos.json && [ -z "$(git ls-files --others --exclude-standard docs/assets/repos.json)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "SiteQ8"
          git config user.email "311682+SiteQ8@users.noreply.github.com"
          git add docs/assets/repos.json
          git commit -m "Repositories as of $(date -u +'%Y-%m-%d %H:%M') UTC"
          git pull --rebase -q origin main
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Ask Pages to publish
        if: steps.commit.outputs.changed == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" --silent
