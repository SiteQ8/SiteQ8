<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Ali AlEnezi, Cybersecurity Expert, Kuwait. I break things carefully, then build the defense in the open.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a0e17"/><stop offset="1" stop-color="#0c1526"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#4a9eff"/><stop offset="1" stop-color="#7ab8ff"/></linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#a9b6ce"/></linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4a9eff" stop-opacity="0"/><stop offset=".5" stop-color="#4a9eff" stop-opacity=".22"/><stop offset="1" stop-color="#4a9eff" stop-opacity="0"/></linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#212c44" stroke-width="1"/></pattern>
    <radialGradient id="glow" cx=".5" cy="0" r=".8"><stop offset="0" stop-color="#4a9eff" stop-opacity=".22"/><stop offset="1" stop-color="#4a9eff" stop-opacity="0"/></radialGradient>
    <clipPath id="frame"><rect width="1200" height="320" rx="20"/></clipPath>
    <style>
      .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
      .sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
      .type{stroke-dasharray:1200;animation:none}
      .caret{animation:blink 1s steps(2) infinite}
      .line1{clip-path:inset(0 100% 0 0);animation:type 2.2s steps(46) .6s forwards}
      .line2{clip-path:inset(0 100% 0 0);animation:type 2.6s steps(58) 3.2s forwards}
      .prompt2{opacity:0;animation:show .1s 3.1s forwards}
      .scan{animation:scan 7s linear infinite}
      .pulse{animation:pulse 2.4s ease-in-out infinite}
      .node{animation:pulse 3s ease-in-out infinite}
      @keyframes type{to{clip-path:inset(0 0 0 0)}}
      @keyframes blink{50%{opacity:0}}
      @keyframes show{to{opacity:1}}
      @keyframes scan{0%{transform:translateY(-120px)}100%{transform:translateY(340px)}}
      @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
    </style>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <rect width="1200" height="320" fill="url(#grid)" opacity=".7"/>
    <rect width="1200" height="320" fill="url(#glow)"/>
    <!-- network motif -->
    <g stroke="#4a9eff" stroke-opacity=".25" stroke-width="1" fill="none">
      <path d="M860 60 L940 110 L1030 80 L1100 140 L1040 210 L950 190 L900 250 L820 200 L860 60 Z M940 110 L950 190 M1030 80 L1040 210 M820 200 L740 240 M1100 140 L1170 110"/>
    </g>
    <g fill="#4a9eff">
      <circle class="node" cx="860" cy="60" r="3"/><circle class="node" cx="940" cy="110" r="3.5" style="animation-delay:.4s"/><circle class="node" cx="1030" cy="80" r="3" style="animation-delay:.9s"/>
      <circle class="node" cx="1100" cy="140" r="4" style="animation-delay:1.3s"/><circle class="node" cx="1040" cy="210" r="3" style="animation-delay:.2s"/><circle class="node" cx="950" cy="190" r="3.5" style="animation-delay:1.7s"/>
      <circle class="node" cx="900" cy="250" r="3" style="animation-delay:.7s"/><circle class="node" cx="820" cy="200" r="3.5" style="animation-delay:2s"/><circle class="node" cx="740" cy="240" r="2.5" style="animation-delay:1.1s"/><circle class="node" cx="1170" cy="110" r="2.5" style="animation-delay:.5s"/>
    </g>
    <!-- scan line -->
    <rect class="scan" x="0" y="0" width="1200" height="120" fill="url(#scan)"/>
    <!-- mark -->
    <rect x="56" y="52" width="56" height="56" rx="14" fill="url(#accent)"/>
    <text x="84" y="90" text-anchor="middle" class="mono" font-size="22" font-weight="700" fill="#03101f">AL</text>
    <!-- name -->
    <text x="130" y="86" class="sans" font-size="44" font-weight="800" fill="url(#name)" letter-spacing="-1">Ali AlEnezi</text>
    <text x="410" y="86" class="sans" font-size="22" font-weight="500" fill="#8b97ac">علي العنزي</text>
    <text x="130" y="116" class="sans" font-size="17" font-weight="500" fill="#8b97ac">Cybersecurity Expert · Kuwait · Defense in the open</text>
    <!-- terminal -->
    <rect x="56" y="150" width="700" height="118" rx="12" fill="#121a2b" stroke="#2c3a58"/>
    <circle cx="78" cy="170" r="5" fill="#ff5f57"/><circle cx="96" cy="170" r="5" fill="#febc2e"/><circle cx="114" cy="170" r="5" fill="#28c840"/>
    <text x="380" y="175" text-anchor="middle" class="mono" font-size="11" fill="#5a6478">visitor@3li.info — bash</text>
    <text x="76" y="214" class="mono" font-size="15" fill="#34d399" font-weight="700">$</text>
    <text x="94" y="214" class="mono line1" font-size="15" fill="#e8edf5">whoami → Cybersecurity Expert · Kuwait 🇰🇼</text>
    <text x="76" y="246" class="mono prompt2" font-size="15" fill="#34d399" font-weight="700">$</text>
    <text x="94" y="246" class="mono line2" font-size="15" fill="#e8edf5">I break things carefully, then build the defense in the open.</text>
    <rect class="caret" x="652" y="234" width="9" height="16" fill="#4a9eff"/>
    <!-- pills -->
    <g class="mono" font-size="13">
      <rect x="800" y="278" width="118" height="28" rx="14" fill="#0c1220" stroke="#2c3a58"/><text x="859" y="297" text-anchor="middle" fill="#4a9eff">3li.info</text>
      <rect x="928" y="278" width="150" height="28" rx="14" fill="#0c1220" stroke="#2c3a58"/><text x="1003" y="297" text-anchor="middle" fill="#8b97ac">github.com/SiteQ8</text>
      <rect x="1088" y="278" width="56" height="28" rx="14" fill="#0c1220" stroke="#2c3a58"/><circle class="pulse" cx="1104" cy="292" r="4" fill="#34d399"/><text x="1128" y="297" text-anchor="middle" fill="#8b97ac">live</text>
    </g>
  </g>
</svg>
